<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Donato, Maria Meoli</title>
<meta name="robots" content="noindex">
<script>
  /* The paths of the sections (/software, /pubblicazioni, ...) have a page
     of their own, which gives the preview of a shared link and sends here
     with ?section= [see the end of index.html]; this one catches what is
     left, a section path with a trailing name, and sends any other path home. */
  (function () {
    var p = location.pathname.replace(/^\/+|\/+$/g, '');
    location.replace('/' + (/^[a-z]+$/.test(p) ? '?section=' + p : '') +
                     location.hash);
  })();
</script>
</head>
<body></body>
</html>
