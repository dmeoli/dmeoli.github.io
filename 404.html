<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donato, Maria Meoli</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="robots" content="noindex">
<script>
  /* The paths of the sections (/software, /pubblicazioni, ...) have a page
     of their own, which gives the preview of a shared link and sends here
     with ?section= [see the end of index.html]; this one catches what is
     left, a section path with a trailing name, and sends any other path home. */
  (function () {
    var p = location.pathname.replace(/^\/+|\/+$/g, '');
    location.replace('/' + (/^[a-z]+$/.test(p) ? '?section=' + p : '') +
                     location.hash);
  })();
</script>
</head>
<body>
<p>This page does not exist: go to the <a href="/">home page</a> of Donato, Maria Meoli.</p>
<p lang="it">Questa pagina non esiste: vai alla <a href="/">pagina principale</a> di Donato, Maria Meoli.</p>
</body>
</html>
