<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] }, chtml: { scale: 1 }, startup: { typeset: true } };</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<style>
  body.deck { max-width: none; padding: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 10px 18px; border-bottom: 1px solid var(--rule); }
  .bar h1 { font-size: 22px; margin: 0; }
  .bar p { margin: 0; color: var(--ink-soft); font-style: italic; flex: 1 1 260px; }
  .bar .n { font: 12px 'IBM Plex Mono', monospace; color: var(--ink-soft); }
  iframe { width: 100%; height: 100%; border: 0; }
  .keys { padding: 6px 18px; font: 11px 'IBM Plex Mono', monospace; color: var(--ink-soft); border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
  .keys button { font-size: 11px; padding: 2px 8px; }
</style>
</head>
<body class="deck">
<div class="bar"><h1 id="title"></h1><p id="note"></p><span id="n" class="n"></span></div>
<iframe id="scene" title="scene" allow="fullscreen" allowfullscreen></iframe>
<div class="keys">
  <button id="prev" type="button">◀ PgUp</button><button id="next" type="button">PgDn ▶</button>
  <button id="full" type="button">Full screen (F)</button>
  <span data-l="en">inside a scene: arrow right one step, space play and pause</span><span data-l="it" lang="it">dentro una scena: freccia a destra un passo, spazio avvia e mette in pausa</span>
</div>
<script type="module">
  import { t, onLang } from './src/i18n.js';
  // the talk: each slide is a scene with its whole configuration in the address,
  // its title and note in English (t, n) and in Italian (ti, ni)
  const slides = [
    { t: 'The Lagrangian dual, one multiplier', n: 'Every cut of the dual is a column of the primal; the subgradient zig-zags.',
      ti: 'Il duale lagrangiano, un moltiplicatore', ni: 'Ogni taglio del duale è una colonna del primale; il subgradiente procede a zig-zag.',
      u: 'index.html#s=a1&p=disc&a=subgradient&l0=2.4&s0=0.6' },
    { t: 'Two multipliers: the dual is a polyhedral complex', n: 'Kelley jumps to the corners of the box.',
      ti: 'Due moltiplicatori: il duale è un complesso poliedrale', ni: 'Kelley salta negli angoli del box.',
      u: 'index.html#s=a2&p=ring&a=kelley&v=map&l1=0.2&l2=2.8' },
    { t: 'Stabilization', n: 'The proximal bundle against Kelley, same start, primal and dual of each.',
      ti: 'Stabilizzazione', ni: 'Il metodo bundle prossimale contro Kelley, stesso punto di partenza, primale e duale di ciascuno.',
      u: 'index.html#s=a2&p=ring&a=bundle&v=map&l1=0.2&l2=2.8&t=0.3&m1=0.1&r=1&b=kelley' },
    { t: 'The dual as a roof', n: 'The model comes down onto the Lagrangian function as cuts are added.',
      ti: 'Il duale come un tetto', ni: 'Il modello scende sulla funzione lagrangiana man mano che si aggiungono tagli.',
      u: 'index.html#s=a2&p=ring&a=bundle&v=3d&l1=0.2&l2=2.8&t=0.3&m1=0.1' },
    { t: '\\(z_{\\mathrm{LP}} \\le z_{\\mathrm{LD}} \\le z_{\\mathrm{IP}}\\)', n: 'The Lagrangian bound improves on the continuous relaxation only off the integer hull.',
      ti: '\\(z_{\\mathrm{LP}} \\le z_{\\mathrm{LD}} \\le z_{\\mathrm{IP}}\\)', ni: "Il limite lagrangiano migliora quello del rilassamento continuo solo fuori dall'inviluppo intero.",
      u: 'index.html#s=a2&p=gap&a=bundle&v=map&l1=0.5&l2=1.5&t=0.5&m1=0.1' },
    { t: 'The solvers of SMS++', n: 'SubGradSolver with ColorTV and Volume against BundleSolver.',
      ti: 'I solutori di SMS++', ni: 'SubGradSolver con ColorTV e Volume contro BundleSolver.',
      u: 'index.html#s=a2&p=gap&a=subgradSolver&v=map&l1=0.5&l2=1.5&strStepsize=1&strDeflection=1&beta0=1&tau=1&gamma=2&r=1&b=bundleSolver' },
    { t: 'A dual made of components', n: 'The disaggregated model keeps one cut per component and needs fewer calls than the aggregated one.',
      ti: 'Un duale fatto di componenti', ni: 'Il modello disaggregato tiene un taglio per componente e chiede meno chiamate di quello aggregato.',
      u: 'components.html' },
    { t: 'Benders', n: 'Every cut is a vertex of the dual polygon of the recourse.', u: 'benders.html',
      ti: 'Benders', ni: 'Ogni taglio è un vertice del poligono duale del ricorso.' },
    { t: 'Simplex and its dual', n: 'Each basis gives a dual point, feasible only at the optimum.', u: 'lp.html',
      ti: 'Il simplesso e il suo duale', ni: "Ogni base dà un punto duale, ammissibile solo all'ottimo." },
    { t: 'LP in three dimensions', n: 'The simplex walks along the edges of the polytope, the barrier goes through its interior.',
      ti: 'La PL in tre dimensioni', ni: 'Il simplesso cammina sugli spigoli del politopo, la barriera ne attraversa l\'interno.',
      u: 'lp3d.html' },
    { t: 'Branch and bound', n: 'Every node of the tree is a piece of the polygon.', u: 'integer.html',
      ti: 'Branch and bound', ni: "Ogni nodo dell'albero è un pezzo del poligono." },
    { t: 'Polarity', n: 'A face of one polytope is a vertex of the other.',
      ti: 'Polarità', ni: "Una faccia di un politopo è un vertice dell'altro.",
      u: 'polarity.html' },
    { t: 'Learning is optimization', n: 'The algorithms of optiml on the Rosenbrock valley.',
      ti: 'Apprendere è ottimizzare', ni: 'Gli algoritmi di optiml nella valle di Rosenbrock.',
      u: 'learning.html' },
    { t: 'Primal and dual of an SVM', n: 'A multiplier leaving zero lights a support vector.', u: 'svm.html',
      ti: 'Primale e duale di una SVM', ni: 'Un moltiplicatore che lascia lo zero accende un vettore di supporto.' },
    { t: 'Inside a network', n: 'SGD against Adam, same data, same initial weights.',
      ti: 'Dentro una rete', ni: 'SGD contro Adam, stessi dati, stessi pesi iniziali.',
      u: 'network.html#data=spiral&feats=x1,x2,sinx1,sinx2&hidden=6,4&race=1&opt=sgd&optB=adam&lr=0.03' },
    { t: 'Depth', n: 'Initialization, normalization and residual connections decide whether a deep network trains.',
      ti: 'Profondità', ni: 'Inizializzazione, normalizzazione e connessioni residue decidono se una rete profonda si addestra.',
      u: 'depth.html' },
    { t: 'Layers as deformations', n: 'Each layer bends the plane until the two classes can be cut by a line.',
      ti: 'Strati come deformazioni', ni: 'Ogni strato piega il piano finché le due classi si separano con una retta.',
      u: 'manifolds.html' },
    { t: 'Superposition', n: 'When the features are sparse, more of them fit than there are dimensions.',
      ti: 'Superposition', ni: 'Quando le feature sono sparse, ne entrano più di quante siano le dimensioni.',
      u: 'superposition.html' },
    { t: 'Convolution', n: 'The filter slides over the input, and each cell of a map depends on a window of the image.',
      ti: 'Convoluzione', ni: 'Il filtro scorre sull\'input, e ogni cella di una mappa dipende da una finestra dell\'immagine.',
      u: 'conv.html' },
    { t: 'LSTM and GRU', n: 'The gated cells carry a bit across many steps, while the gradient of the plain network vanishes.',
      ti: 'LSTM e GRU', ni: 'Le celle con i gate portano un bit attraverso molti passi, mentre il gradiente della rete semplice svanisce.',
      u: 'lstm.html' },
    { t: 'Attention', n: 'The pattern of every head forms under the eyes while the transformer learns.',
      ti: 'Attention', ni: 'Lo schema di ogni testa si forma sotto gli occhi mentre il transformer impara.',
      u: 'attention.html' },
    { t: 'State-space models', n: 'The same model is a recurrence and a convolution; the selective one chooses what to keep.',
      ti: 'Modelli a spazio di stato', ni: 'Lo stesso modello è una ricorrenza e una convoluzione; quello selettivo sceglie cosa tenere.',
      u: 'ssm.html' },
    { t: 'Graph networks', n: 'Message passing round by round, and two graphs that no number of rounds can tell apart.',
      ti: 'Reti su grafi', ni: 'Il message passing round per round, e due grafi che nessun numero di round distingue.',
      u: 'gnn.html' },
    { t: 'Mixture of experts', n: 'The router carves the plane into regions, one expert each; without the balancing loss it collapses onto few of them.',
      ti: 'Mixture of experts', ni: 'Il router divide il piano in regioni, una per esperto; senza la loss di bilanciamento si concentra su pochi di loro.',
      u: 'moe.html' },
    { t: 'Representations', n: 'What each layer has learnt, projected in the plane layer by layer.',
      ti: 'Rappresentazioni', ni: 'Ciò che ogni strato ha imparato, proiettato nel piano strato per strato.',
      u: 'representations.html' },
    { t: 'Latent space', n: 'An autoencoder and a variational one arrange the data in the plane of their code.',
      ti: 'Spazio latente', ni: 'Un autoencoder e uno variazionale dispongono i dati nel piano del loro codice.',
      u: 'latent.html' },
    { t: 'Diffusion', n: 'Noise is added step by step, and a network learns to take it away.',
      ti: 'Diffusione', ni: 'Il rumore si aggiunge passo per passo, e una rete impara a toglierlo.',
      u: 'diffusion.html' },
    { t: 'Hebbian learning', n: 'Hebb grows along the principal eigenvector, Oja settles on it: online PCA.',
      ti: 'Apprendimento hebbiano', ni: "Hebb cresce lungo l'autovettore principale, Oja vi si ferma: la PCA online.",
      u: 'hebbian.html' },
    { t: 'Hopfield networks', n: 'Recall is a descent of the energy, and the dense memory is attention.',
      ti: 'Reti di Hopfield', ni: "Il richiamo è una discesa dell'energia, e la memoria densa è l'attention.",
      u: 'hopfield.html' },
    { t: 'Izhikevich neurons', n: 'Twenty firing patterns from four parameters, in the phase plane.',
      ti: 'Neuroni di Izhikevich', ni: 'Venti comportamenti di sparo da quattro parametri, nel piano delle fasi.',
      u: 'izhikevich.html' },
    { t: 'Spiking networks', n: 'The step has no derivative, and a surrogate one trains the network all the same.',
      ti: 'Reti a impulsi', ni: 'Il gradino non ha derivata, e una derivata surrogata addestra comunque la rete.',
      u: 'spiking.html' },
    { t: 'Echo state networks', n: 'A random reservoir and a readout trained by ridge regression, a convex problem.',
      ti: 'Echo state network', ni: 'Un serbatoio casuale e una lettura addestrata con la ridge regression, un problema convesso.',
      u: 'esn.html' },
  ];
  let i = Math.max(0, Math.min(slides.length - 1, (+location.hash.slice(1) || 1) - 1));
  const $ = id => document.getElementById(id);
  function show() {
    const s = slides[i], M = window.MathJax && MathJax.typesetPromise ? MathJax : null;
    if (M) M.typesetClear([$('title'), $('note')]);
    $('title').textContent = t(s.t, s.ti); $('note').textContent = t(s.n, s.ni); $('n').textContent = `${i + 1} / ${slides.length}`;
    // the titles may hold formulas
    if (M) M.startup.promise = M.startup.promise.then(() => M.typesetPromise([$('title'), $('note')]));
    if ($('scene').getAttribute('src') !== s.u) $('scene').src = s.u;
    history.replaceState(null, '', '#' + (i + 1));
  }
  // the texts of the deck in the language of the site (the scene follows it by itself)
  function labels() {
    document.title = t('Playground talk', 'Presentazione del playground');
    $('full').textContent = t('Full screen (F)', 'Schermo intero (F)');
    $('scene').title = t('scene', 'scena');
  }
  onLang(() => { labels(); show(); });
  labels();
  const go = d => { i = Math.max(0, Math.min(slides.length - 1, i + d)); show(); };
  $('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
  $('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  const keys = e => {
    if (e.key === 'PageDown') { e.preventDefault(); go(1); }
    if (e.key === 'PageUp') { e.preventDefault(); go(-1); }
    if (e.key === 'f' || e.key === 'F') $('full').click();
  };
  document.addEventListener('keydown', keys);
  // the keys pressed inside the scene reach the deck too
  $('scene').addEventListener('load', () => { try { $('scene').contentDocument.addEventListener('keydown', keys); } catch (e) {} });
  show();
</script>
</body>
</html>
